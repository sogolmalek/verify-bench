# Gemini's daily side run (PREREGISTRATION.md, amendment 2): 20 requests a day from the bench's own Google project, reported apart.
# It runs this repository's own scripts only, never a PR's code, and commits only results/gemini-votes.jsonl.
name: gemini-daily
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions: {}
concurrency: { group: gemini-daily, cancel-in-progress: false }
jobs:
  vote:
    runs-on: ubuntu-latest
    environment: gemini
    permissions: { contents: write }
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24' }
      - run: npm ci
      - run: test -f tasks/sample.json || { echo 'no sample yet'; exit 0; }
      - run: npx tsx scripts/gemini-daily.mts
        if: hashFiles('tasks/sample.json') != ''
        env:
          BENCH_GEMINI_API_KEY: ${{ secrets.BENCH_GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit the day's votes
        if: hashFiles('results/gemini-votes.jsonl') != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/gemini-votes.jsonl
          git diff --cached --quiet || { git commit -m "Gemini's votes, $(date -u +%F)"; git push; }
